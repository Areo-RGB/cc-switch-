name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "rust-toolchain.toml"
      - "vite.config.ts"
      - ".github/workflows/linux-appimage.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "rust-toolchain.toml"
      - "vite.config.ts"
      - ".github/workflows/linux-appimage.yml"

permissions:
  contents: read

jobs:
  linux-appimage:
    name: Linux AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libfuse2 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The repository enables signed updater artifacts by default.
      # These downloadable CI AppImages are standalone, not updater packages.
      - name: Build AppImage (without updater signing)
        run: |
          pnpm tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify AppImage output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#appimages[@]}" -ne 1 ]; then
            echo "::error::Expected one AppImage, found ${#appimages[@]}"
            exit 1
          fi
          file "${appimages[0]}"
          chmod +x "${appimages[0]}"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: CC-Switch-Linux-${{ matrix.arch }}-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
