name: Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  windows-portable:
    name: Windows portable (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: Configure ARM64 LLVM
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path $llvmBin)) { throw "LLVM not found: $llvmBin" }
          "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV
          "CLANG_PATH=$llvmBin\clang.exe" >> $env:GITHUB_ENV
          $llvmBin >> $env:GITHUB_PATH
      - name: Install pnpm
        shell: pwsh
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build portable executable (no installer)
        shell: pwsh
        run: pnpm tauri build --target ${{ matrix.target }} --no-bundle
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "src-tauri/target/${{ matrix.target }}/release/cc-switch.exe"
          if (-not (Test-Path $exe)) {
            $exe = "src-tauri/target/release/cc-switch.exe"
          }
          if (-not (Test-Path $exe)) { throw "Portable executable not found" }
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item $exe portable/
          @('portable=true', 'arch=${{ matrix.arch }}') | Set-Content portable/portable.ini -Encoding utf8
          $zip = "CC-Switch-Windows-${{ matrix.arch }}-Portable.zip"
          Compress-Archive -Path portable/* -DestinationPath $zip -Force
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: CC-Switch-Windows-${{ matrix.arch }}-Portable
          path: CC-Switch-Windows-${{ matrix.arch }}-Portable.zip
          if-no-files-found: error
